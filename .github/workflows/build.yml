name: Research Site Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '**/*.md'

      - name: Check YAML Frontmatter
        run: |
          python3 -c "
          import glob, yaml, sys
          errors = []
          for f in glob.glob('**/opportunity-*.md', recursive=True):
            with open(f) as fh:
              content = fh.read()
            if content.startswith('---'):
              try:
                yaml.safe_load(content.split('---')[1])
              except Exception as e:
                errors.append(f'{f}: {e}')
          if errors:
            for e in errors:
              print(e)
            sys.exit(1)
          print('All YAML frontmatter valid.')
          "

      # Future: add site generation step here
      # - name: Build Site
      #   run: make build
